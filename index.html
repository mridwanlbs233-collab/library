<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BacaIn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOGIN -->
  <section id="login" class="login">
    <div class="login-card">
      <div class="brand-panel">
        <p class="logo">Baca<span>In</span></p>
        <p class="tagline">Cari, pinjam, dan kembalikan buku dengan mudah.</p>
      </div>
      <form id="login-form" novalidate>
        <h1>Masuk ke akun</h1>
        <p class="hint">Akun contoh: admin / admin123, ridwan / ridwan123</p>
        <label>Username<input id="login-user" autocomplete="username"></label>
        <label>Password<input id="login-pass" type="password" autocomplete="current-password"></label>
        <p id="login-err" class="err" role="alert"></p>
        <button class="btn">Masuk</button>
      </form>
    </div>
  </section>

  <!-- APLIKASI -->
  <div id="app" hidden>
    <header class="topbar">
      <h1 class="brand">Baca<span>In</span></h1>
      <div class="user-box">
        <span id="who"></span>
        <span id="loan-count"></span>
        <label class="sim">Tanggal hari ini <input id="sim-date" type="date"></label>
        <button class="btn ghost light" data-act="history">Riwayat</button>
        <button class="btn ghost light" data-act="logout">Keluar</button>
      </div>
    </header>

    <main>
      <section class="controls" aria-label="Cari dan filter buku">
        <input id="search-input" type="search" placeholder="Cari judul atau penulis" aria-label="Cari buku">
        <select id="category-filter" aria-label="Filter kategori"></select>
        <select id="status-filter" aria-label="Filter status">
          <option value="semua">Semua status</option>
          <option value="tersedia">Tersedia</option>
          <option value="habis">Stok habis</option>
          <option value="dipinjam">Sedang kamu pinjam</option>
        </select>
        <select id="sort-select" aria-label="Urutkan buku">
          <option value="default">Urutan awal</option>
          <option value="az">Judul A-Z</option>
          <option value="za">Judul Z-A</option>
          <option value="stok">Stok terbanyak</option>
        </select>
        <div class="btn-row">
          <button id="clear-btn" class="btn ghost" data-act="clear">Hapus filter</button>
          <button id="add-btn" class="btn" data-act="edit" data-id="0">Tambah buku</button>
          <button id="reset-btn" class="btn ghost" data-act="reset">Reset data</button>
        </div>
      </section>

      <section id="history" class="history" hidden></section>
      <p id="result-info" class="result-info" aria-live="polite"></p>
      <div id="book-list" class="book-list"></div>
      <p id="empty-state" class="empty-state" hidden>Tidak ada buku yang cocok. Coba ubah kata kunci atau filter.</p>
      <nav id="pager" class="pager" aria-label="Halaman"></nav>
    </main>
  </div>

  <datalist id="cat-list"></datalist>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
